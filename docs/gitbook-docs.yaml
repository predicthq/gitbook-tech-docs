$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Tech Docs
  structure:
    - type: section
      key: section-1
      title: Tech Docs
      path: tech-docs
      description: ""
      default: true
      children:
        - type: space
          key: space-1
          title: Tech Docs
          path: tech-docs
          default: true
          content:
            directory: ./docs/tech-docs
    - type: section
      key: section-2
      title: API Reference
      path: api
      children:
        - type: space
          key: space-2
          title: API Reference
          path: api-reference
          default: true
          content:
            directory: ./docs/api
    - type: section
      key: section-3
      title: Changelog
      path: changelog
      description: ""
      children:
        - type: space
          key: space-3
          title: Changelog
          path: changelog
          default: true
          content:
            directory: ./docs/changelog
